server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy /api/* to the agent service inside the compose network.
  # Strip the /api prefix so the agent sees the original FastAPI path.
  location /api/ {
    proxy_pass http://rp-agent:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback so deep links / refresh land on index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
